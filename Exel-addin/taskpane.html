<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Excel Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/office.js/1.1.73/office.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --border: #252a35;
      --accent: #4ade80;
      --accent2: #22d3ee;
      --text: #e8eaf0;
      --muted: #6b7280;
      --user-bg: #1a2235;
      --ai-bg: #111827;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
    }

    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .model-badge {
      margin-left: auto;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--accent);
      background: rgba(74,222,128,0.08);
      border: 1px solid rgba(74,222,128,0.2);
      padding: 3px 7px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    #api-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    #api-section label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .api-row {
      display: flex;
      gap: 6px;
    }

    #api-key {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    #api-key:focus { border-color: var(--accent); }

    #save-key {
      background: var(--accent);
      color: #0d0f14;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #save-key:hover { opacity: 0.85; }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding-left: 2px;
    }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .msg-label { color: var(--accent2); }
    .user .msg-bubble {
      background: var(--user-bg);
      border: 1px solid rgba(34,211,238,0.15);
      border-bottom-right-radius: 3px;
    }

    .ai .msg-label { color: var(--accent); }
    .ai .msg-bubble {
      background: var(--ai-bg);
      border: 1px solid rgba(74,222,128,0.12);
      border-bottom-left-radius: 3px;
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
    }

    .error .msg-bubble {
      background: rgba(248,113,113,0.08);
      border-color: rgba(248,113,113,0.2);
      color: var(--danger);
    }

    .typing-indicator {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 13px;
      background: var(--ai-bg);
      border: 1px solid rgba(74,222,128,0.12);
      border-radius: 10px;
      border-bottom-left-radius: 3px;
      width: fit-content;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    #controls {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 6px;
    }

    #use-selection {
      background: rgba(34,211,238,0.08);
      border: 1px solid rgba(34,211,238,0.2);
      color: var(--accent2);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    #use-selection:hover { background: rgba(34,211,238,0.15); }

    #input-area {
      flex: 1;
      display: flex;
      gap: 6px;
    }

    #prompt {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 36px;
      max-height: 90px;
    }

    #prompt:focus { border-color: var(--accent); }
    #prompt::placeholder { color: var(--muted); }

    #send {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
      flex-shrink: 0;
    }

    #send:hover { opacity: 0.9; transform: scale(1.05); }
    #send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #send svg { width: 16px; height: 16px; fill: #0d0f14; }

    .welcome {
      text-align: center;
      padding: 30px 20px;
      color: var(--muted);
    }

    .welcome .icon { font-size: 32px; margin-bottom: 10px; }
    .welcome h2 { font-size: 14px; color: var(--text); margin-bottom: 6px; }
    .welcome p { font-size: 11px; line-height: 1.6; }

    .chip-row {
      display: flex; flex-wrap: wrap; gap: 5px;
      justify-content: center; margin-top: 12px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 10px;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="logo">✦</div>
  <h1>AI Excel Assistant</h1>
  <span class="model-badge">gemini-2.5-flash-preview-04-17</span>
</header>

<div id="api-section">
  <label>Gemini API Key</label>
  <div class="api-row">
    <input type="password" id="api-key" placeholder="AIza..." />
    <button id="save-key">Save</button>
  </div>
</div>

<div id="chat-area">
  <div class="welcome">
    <div class="icon">⚡</div>
    <h2>Gemini 2.5 Flash Preview</h2>
    <p>Posez des questions sur vos données,<br/>analysez des plages, générez des formules.</p>
    <div class="chip-row">
      <span class="chip" onclick="useChip(this)">Résume mes données</span>
      <span class="chip" onclick="useChip(this)">Génère une formule</span>
      <span class="chip" onclick="useChip(this)">Analyse cette plage</span>
      <span class="chip" onclick="useChip(this)">Trouve les doublons</span>
    </div>
  </div>
</div>

<div id="controls">
  <button id="use-selection">📋 Sélection</button>
  <div id="input-area">
    <textarea id="prompt" placeholder="Posez une question..." rows="1"></textarea>
    <button id="send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  let apiKey = localStorage.getItem('gemini_api_key') || '';
  let selectionData = null;

  if (apiKey) {
    document.getElementById('api-key').value = apiKey;
  }

  document.getElementById('save-key').addEventListener('click', () => {
    apiKey = document.getElementById('api-key').value.trim();
    localStorage.setItem('gemini_api_key', apiKey);
    showToast('✅ Clé sauvegardée');
  });

  function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#1e2a1e;color:#4ade80;border:1px solid #4ade80;padding:6px 14px;border-radius:20px;font-size:11px;z-index:999;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  Office.onReady(() => {
    document.getElementById('use-selection').addEventListener('click', async () => {
      try {
        await Excel.run(async (ctx) => {
          const range = ctx.workbook.getSelectedRange();
          range.load(['values', 'address']);
          await ctx.sync();
          selectionData = { address: range.address, values: range.values };
          showToast(`📋 ${range.address} chargé`);
        });
      } catch (e) {
        showToast('❌ Erreur de sélection');
      }
    });
  });

  function useChip(el) {
    document.getElementById('prompt').value = el.textContent;
    document.getElementById('prompt').focus();
  }

  document.getElementById('prompt').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById('send').addEventListener('click', sendMessage);

  function addMessage(role, text, isError = false) {
    const chat = document.getElementById('chat-area');
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `message ${isError ? 'error' : role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'Vous' : isError ? 'Erreur' : 'Gemini';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    div.appendChild(label);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const chat = document.getElementById('chat-area');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Gemini';

    const ind = document.createElement('div');
    ind.className = 'typing-indicator';
    ind.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    div.appendChild(label);
    div.appendChild(ind);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('prompt');
    const text = input.value.trim();
    if (!text) return;
    if (!apiKey) { showToast('⚠️ Entrez votre API Key'); return; }

    input.value = '';
    document.getElementById('send').disabled = true;

    let userMsg = text;
    if (selectionData) {
      userMsg += `\n\n[Données Excel - ${selectionData.address}]\n`;
      userMsg += selectionData.values.map(r => r.join('\t')).join('\n');
      selectionData = null;
    }

    addMessage('user', text);
    addTyping();

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-04-17:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userMsg }] }],
            systemInstruction: {
              parts: [{ text: "Tu es un assistant Excel expert. Aide l'utilisateur à analyser ses données, créer des formules, et interpréter ses tableaux. Réponds en français. Sois concis et précis." }]
            },
            generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
          })
        }
      );

      const data = await res.json();
      removeTyping();

      if (data.error) {
        addMessage('ai', data.error.message, true);
      } else {
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Pas de réponse.';
        addMessage('ai', reply);
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', 'Erreur réseau: ' + err.message, true);
    }

    document.getElementById('send').disabled = false;
  }
</script>
</body>
</html>
